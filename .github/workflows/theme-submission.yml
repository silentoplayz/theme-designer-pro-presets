name: Theme Submission Bot

on:
  issues:
    types: [opened]

# Only one submission processed at a time to avoid branch conflicts
concurrency:
  group: theme-submission
  cancel-in-progress: false

jobs:
  process:
    # Only run for issues with the theme-submission label (set by issue template)
    if: contains(github.event.issue.labels.*.name, 'theme-submission')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # ── Process the submission ──
      - name: Process theme submission
        id: process
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: node scripts/process-submission.js

      # ── On failure: comment with errors ──
      - name: Comment on failure
        if: steps.process.outputs.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const errors = `${{ steps.process.outputs.errors }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `## ❌ Theme Validation Failed`,
                ``,
                `Hey @${context.payload.issue.user.login}, the bot found some issues with your submission:`,
                ``,
                ...errors.split('\n').map(e => `- ${e}`),
                ``,
                `**Please edit this issue** to fix the problems above, then close and re-open it to trigger the bot again.`,
                ``,
                `---`,
                `*🤖 Automated validation by Theme Submission Bot*`
              ].join('\n')
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['invalid']
            });

      # ── On success: validate, create branch, PR ──
      - name: Run full validation
        if: steps.process.outputs.result == 'success'
        run: node scripts/validate.js

      # ── Screenshots of the theme on the mock, one per mode ──
      # A failed render never blocks the submission; the PR goes out without them
      - name: Render previews
        if: steps.process.outputs.result == 'success'
        id: shots
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILENAME: ${{ steps.process.outputs.filename }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.56.1
          node scripts/render-previews.js "themes/${FILENAME}" "${RUNNER_TEMP}/shots"

          # The screenshots live on their own branch, so main never carries them
          DEST="${RUNNER_TEMP}/previews"
          git init -q "${DEST}"
          cd "${DEST}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin submission-previews 2>/dev/null; then
            git checkout -q -b submission-previews FETCH_HEAD
          else
            git checkout -q --orphan submission-previews
          fi
          mkdir -p "${ISSUE_NUM}"
          cp "${RUNNER_TEMP}"/shots/*.png "${ISSUE_NUM}/"
          git add "${ISSUE_NUM}"
          git diff --cached --quiet || git commit -q -m "Previews for #${ISSUE_NUM}"
          git push -q origin submission-previews

          # Linked by commit, so a later render never changes what the PR shows
          SHA=$(git rev-parse HEAD)
          cd "${GITHUB_WORKSPACE}"
          {
            echo 'table<<PREVIEWS_EOF'
            node scripts/render-previews.js --markdown "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/${ISSUE_NUM}" "${RUNNER_TEMP}/shots"
            echo 'PREVIEWS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create branch and PR
        if: steps.process.outputs.result == 'success'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILENAME: ${{ steps.process.outputs.filename }}
          THEME_NAME: ${{ steps.process.outputs.theme_name }}
          MODES: ${{ steps.process.outputs.modes }}
          SIZE: ${{ steps.process.outputs.size }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          SUBMITTER: ${{ github.event.issue.user.login }}
          PREVIEWS: ${{ steps.shots.outputs.table }}
        run: |
          BRANCH="theme-submission/${ISSUE_NUM}-$(echo "${FILENAME}" | sed 's/.json$//')"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BRANCH}"
          git add "themes/${FILENAME}"
          git commit -m "feat: add community theme '${THEME_NAME}'

          Submitted by @${SUBMITTER} via #${ISSUE_NUM}

          Modes: ${MODES}
          File: themes/${FILENAME} (${SIZE} KB)"

          git push origin "${BRANCH}"

          # The Studio opens the theme from this commit, which outlives the branch
          SHA=$(git rev-parse HEAD)
          PREVIEW_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/studio/#theme=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/themes/${FILENAME}"
          echo "preview_url=${PREVIEW_URL}" >> $GITHUB_OUTPUT

          SHOTS=""
          if [ -n "${PREVIEWS}" ]; then
            SHOTS="### Screenshots

          ${PREVIEWS}

          "
          fi

          PR_URL=$(gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "feat: add community theme '${THEME_NAME}'" \
            --body "## 🎨 New Theme: ${THEME_NAME}

          **Submitted by:** @${SUBMITTER}
          **Source issue:** #${ISSUE_NUM}
          **File:** \`themes/${FILENAME}\` (${SIZE} KB)
          **Modes:** ${MODES}
          **Preview:** [Open it in the Studio](${PREVIEW_URL})

          ${SHOTS}---

          This PR was automatically generated from a [theme submission](https://github.com/${GITHUB_REPOSITORY}/issues/${ISSUE_NUM}). The theme JSON has been validated and is ready for review.

          ### Reviewer Checklist
          - [ ] Theme renders correctly in Theme Designer Pro
          - [ ] Colors are visually appealing and intentional
          - [ ] No broken or overlapping UI elements

          ---
          *🤖 Automated PR by Theme Submission Bot*" \
            --label "theme-submission")

          echo "pr_url=${PR_URL}" >> $GITHUB_OUTPUT

      - name: Comment on success
        if: steps.process.outputs.result == 'success'
        uses: actions/github-script@v7
        env:
          PREVIEWS: ${{ steps.shots.outputs.table }}
        with:
          script: |
            const prUrl = `${{ steps.pr.outputs.pr_url }}`;
            const previewUrl = `${{ steps.pr.outputs.preview_url }}`;
            const filename = `${{ steps.process.outputs.filename }}`;
            const themeName = `${{ steps.process.outputs.theme_name }}`;
            const modes = `${{ steps.process.outputs.modes }}`;
            const size = `${{ steps.process.outputs.size }}`;
            const warnings = `${{ steps.process.outputs.warnings }}`;

            let body = [
              `## ✅ Theme Validated Successfully!`,
              ``,
              `Hey @${context.payload.issue.user.login}, your theme **${themeName}** passed validation! 🎉`,
              ``,
              `| Detail | Value |`,
              `|---|---|`,
              `| **File** | \`themes/${filename}\` |`,
              `| **Size** | ${size} KB |`,
              `| **Modes** | ${modes} |`,
              `| **Pull Request** | ${prUrl} |`,
              `| **Preview** | [Open it in the Studio](${previewUrl}) |`,
              ``,
              `The preview shows your theme on a mock Open WebUI in every mode, without installing anything.`,
              ``
            ];

            if (process.env.PREVIEWS) {
              body.push(`### Screenshots`, ``, process.env.PREVIEWS, ``);
            }

            if (warnings) {
              body.push(`### ⚠️ Warnings`, ``);
              body.push(...warnings.split('\n').map(w => `- ${w}`));
              body.push(``);
            }

            body.push(
              `Your theme will be reviewed and merged by a maintainer. Once merged, it will automatically appear in the [Preset Gallery](https://silentoplayz.github.io/theme-designer-pro-presets/gallery/) and be included in the next bundle update.`,
              ``,
              `---`,
              `*🤖 Automated validation by Theme Submission Bot*`
            );

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.join('\n')
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['validated']
            });
